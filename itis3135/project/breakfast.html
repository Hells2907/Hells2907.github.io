<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continental Inn - Gallery - Rooms</title>
  <link rel="stylesheet" href="styles/project.css">
</head>
<style>
    .hero-image {
      background-size: cover;
      height: 100vh; 
    
    }
    .gallery {
      display: flex;
      flex-wrap: wrap; 
      justify-content: center;
    }

    
    .gallery img {
      max-width: 100%; 
      height: 700px; 
      object-fit: cover; 
      margin: 5px; 
    }

   
    .gallery img:first-child {
      display: block;
    }
    main{
        color: rgba(0, 0, 96, 0.815);
    }

</style>

<body>
  <header>
    <a href="index.html" class="logo">
        <img src="images/logo-png.png" alt="Continental Inn Logo">
      </div>
    
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="reservations.html">Reservations</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="gallery-section">
        <h2>Breakfast</h2>
        
        <div class="gallery">
          <img src="images/breakfast1.jpeg" alt="Breakfast Image 1">
          <img src="images/breakfast2.jpeg" alt="Breakfast Image 2">
          <img src="images/breakfast3.jpeg" alt="Breakfast Image 3">
          <img src="images/breakfast4.jpeg" alt="Breakfast Image 4">
         
        </div>
      </section>

  </main>

  <script>
    
    let slideIndex = 0;
    const slides = document.querySelectorAll('.gallery img');
    
    
    function showSlide() {
      for (let i = 0; i < slides.length; i++) {
        slides[i].style.display = 'none';
      }
      slideIndex++;
      if (slideIndex > slides.length) {
        slideIndex = 1;
      }
      slides[slideIndex - 1].style.display = 'block';
      setTimeout(showSlide, 2000); 
    }

    showSlide(); 
  </script>

  <footer>
    <div class="left-section">
      <p>Continental Inn</p>
      <p>123 Hotel Street, Charlotte, North Carolina</p>
      <p>Phone: 123-456-7890</p>
    </div>

    <div class="right-section">
      <p>Page Built by <a href="https://acharyainsights.com/index.html">Acharya Insights</a>&copy; 2023</p>
      <a href="https://validator.w3.org/check?uri=referer">
        <img style="border:0;width:88px;height:31px" src="https://upload.wikimedia.org/wikipedia/commons/b/bb/W3C_HTML5_certified.png" alt="Valid HTML!">
      </a>
      <a href="https://jigsaw.w3.org/css-validator/check/referer">
        <img style="border:0;width:88px;height:31px" src="https://jigsaw.w3.org/css-validator/images/vcss" alt="Valid CSS!">
      </a>
    </div>
  </footer>

</body>

</html>
