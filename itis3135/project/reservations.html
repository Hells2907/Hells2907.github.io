  <header>
    <a href="index.html" class="logo">
        <img src="images/logo-png.png" alt="Continental Inn Logo">

  <main>
    <div id="background-image">
      <div class="content">
        <form id="reservation-form">
          <h2>Make a Reservation</h2>

          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required><br><br>

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required><br><br>

          <label for="check-in-date">Check-in Date:</label>
          <input type="date" id="check-in-date" name="check-in-date" required><br><br>

          <label for="check-out-date">Check-out Date:</label>
          <input type="date" id="check-out-date" name="check-out-date" required><br><br>

          <label for="room-type">Room Type:</label>
          <select id="room-type" name="room-type">
            <option value="single">Single</option>
            <option value="double">Double</option>
            <option value="suite">Suite</option>
          </select><br><br>

          <label for="guests">Number of Guests:</label>
          <input type="number" id="guests" name="guests" min="1" max="10" required><br><br>

          <label for="special-requests">Special Requests:</label><br>
          <textarea id="special-requests" name="special-requests" rows="4" cols="50"></textarea><br><br>

          <input type="submit" value="Submit">
        </form>
      </div>
    </div>
  </main>
