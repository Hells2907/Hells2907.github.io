<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial scale=1.0">
        <title>Helly Acharya's Homey Alligator || ITIS 3135 Slideshow</title>
        <link rel="stylesheet" type="text/css" href="styles/default.css">
        <style>
            body {
                background-image: url('images/backgroundimage.JPG');
                background-size: cover;
                background-repeat: no-repeat;
                background-attachment: fixed;
                margin: 0;
                padding: 0;
            }
    
           
        </style>   
    </head>

<body>
    <div class="container"> 
    <div data-include="components/header.html"></div>
    <script src="scripts/HTMLInclude.min.js"></script>
    <main>
      <h2> Name Slideshow</h2>
      
      <div class="slideshow-container">
          <div class="mySlides">
              <div class="number-text">1 / 12</div>
              <img src="images/hoodiepic.JPG"> 
          </div>

          <div class="mySlides">
              <div class="number-text">2 / 12</div>
              <img src="images/eggpic.jpeg">
          </div>

          <div class="mySlides">
              <div class="number-text">3 / 12</div>
              <img src="images/librarypic.JPG">
          </div>

          <div class="mySlides">
              <div class="number-text">4 / 12</div>
              <img src="images/lipbalmpic.jpeg">
          </div>

          <div class="mySlides">
              <div class="number-text">5 / 12</div>
              <img src="images/yellowpepperpic.jpeg">
          </div>

          <div class="mySlides">
              <div class="number-text">6 / 12</div>
              <img src="images/airplanepic.JPG">
          </div>

          <div class="mySlides">
              <div class="number-text">7 / 12</div>
              <img src="images/catpic.JPG">
          </div>

          <div class="mySlides">
              <div class="number-text">8 / 12</div>
              <img src="images/honeypic.jpeg">
          </div>

          <div class="mySlides">
              <div class="number-text">9 / 12</div>
              <img src="images/apronpic.JPG">
          </div>

          <div class="mySlides">
              <div class="number-text">10 / 12</div>
              <img src="images/riceplatepic.jpeg">
          </div>

          <div class="mySlides">
              <div class="number-text">11 / 12</div>
              <img src="images/yogurtpic.jpeg">
          </div>

          <div class="mySlides">
              <div class="number-text">12 / 12</div>
              <img src="images/almondspic.jpeg">
          </div>

          

          <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
          <a class="next" onclick="plusSlides(1)">&#10095;</a>

          <div class="caption-container">
              <p id="caption"></p>
          </div>

          <div class="row">
              <div class="column">
                  <img class="demo cursor" src="images/hoodiepic.JPG" onclick="currentSlide(1)" alt="H - Hoodie">
              </div>

              <div class="column">
                  <img class="demo cursor" src="images/eggpic.jpeg" onclick="currentSlide(2)" alt="E - Eggs">
              </div>

              <div class="column">
                  <img class="demo cursor" src="images/librarypic.JPG" onclick="currentSlide(3)" alt="L - Library">
              </div>

              <div class="column">
                  <img class="demo cursor" src="images/lipbalmpic.jpeg" onclick="currentSlide(4)" alt="L - Lip Balm">
              </div>

              <div class="column">
                  <img class="demo cursor" src="images/yellowpepperpic.jpeg" onclick="currentSlide(5)" alt="Y - Yellow Pepper">
              </div>

              <div class="column">
                  <img class="demo cursor" src="images/airplanepic.JPG" onclick="currentSlide(6)" alt="A - Airplane">
              </div>

              <div class="column">
                  <img class="demo cursor" src="images/catpic.JPG" onclick="currentSlide(7)" alt="C - Cat">
              </div>

              <div class="column">
                  <img class="demo cursor" src="images/honeypic.jpeg" onclick="currentSlide(8)" alt="H - Honey">
              </div>

              <div class="column">
                  <img class="demo cursor" src="images/apronpic.JPG" onclick="currentSlide(9)" alt="A - Apron">
              </div>

              <div class="column">
                  <img class="demo cursor" src="images/riceplatepic.jpeg" onclick="currentSlide(10)" alt="R - Rice">
              </div>

              <div class="column">
                  <img class="demo cursor" src="images/yogurtpic.jpeg" onclick="currentSlide(11)" alt="Y - Yogurt">
              </div>

              <div class="column">
                  <img class="demo cursor" src="images/almondspic.jpeg" onclick="currentSlide(12)" alt="A - Almonds">
              </div>

              
          </div>
      </div>

      <script src="scripts/slideshow.js"></script>
  </main>
    <div data-include="components/footer.html"></div>
    <script src="scripts/HTMLInclude.min.js"></script>
 
    </div>

    
    
</body>
</html>
